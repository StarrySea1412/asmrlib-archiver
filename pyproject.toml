[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asmrlib-archiver"
version = "0.1.0"
description = "Conservative same-domain archiver for authorized ASMRLIB pages."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.0",
  "PyYAML>=6.0.1",
  "rich>=13.7.1",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.0",
    "pyinstaller>=6.0",
    "pycryptodome>=3.23.0",
]
dev = ["pytest>=8.0.0", "ruff>=0.5.0", "coverage>=7.5.0"]

[project.scripts]
asmrlib-archiver = "asmrlib_archiver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length 由 formatter 管

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["src/asmrlib_archiver"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
