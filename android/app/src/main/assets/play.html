<!doctype html>
<!-- asmrlib-play v1 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src https: data:; script-src 'unsafe-inline'; form-action 'none'; base-uri 'none'; object-src 'none'; connect-src 'none'">
<meta name="theme-color" content="#0a0b0f">
<title>播放 · ASMR 收藏馆</title>
<style>
/* =====================================================================
   1. TOKENS
   Dark is the product theme, independent of the operating system setting.
   ===================================================================== */
:root {
  color-scheme: dark;

  --bg: #0a0b0f;
  --surface: #15171e;
  --surface-2: #1e212a;
  --surface-3: #262a34;
  --fill: rgba(255,255,255,.065);
  --fill-strong: rgba(255,255,255,.12);
  --sep: rgba(255,255,255,.085);
  --sep-strong: rgba(255,255,255,.17);
  /* Opaque fallback; transparency is enabled only with working blur. */
  --nav-bg: #0e1016;
  --glass-nav: rgba(17,20,29,.82);
  --glass-edge: rgba(232,240,255,.24);
  --glass-highlight: rgba(255,255,255,.12);
  --glass-wash: rgba(174,196,255,.06);
  --glass-sheen: linear-gradient(145deg, var(--glass-highlight), transparent 45%, var(--glass-wash));

  --text: #f1f3f8;
  --text-2: #a2acbd;
  --text-3: #6e7a8c;
  --text-on-accent: #06101f;

  /* Cool periwinkle tint; full white is reserved for the optical edge. */
  --accent: #7c9cff;
  /* Second stop of the brand mark's gradient.  Native mirrors both stops in
     Theme.java, and test_the_web_and_native_accents_are_the_same_colour fails
     if they drift apart. */
  --accent-strong: #9b7cf0;
  --accent-soft: rgba(124,156,255,.16);
  --accent-line: rgba(124,156,255,.34);
  --danger: #ff7a7a;
  --danger-soft: rgba(255,122,122,.14);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui,
    "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --fs-large-title: 30px;
  --fs-title: 21px;
  --fs-headline: 16px;
  --fs-body: 15px;
  --fs-subhead: 13.5px;
  --fs-footnote: 12.5px;
  --fs-caption: 11.5px;
  --lh-tight: 1.25;
  --lh-body: 1.5;
  --lh-relaxed: 1.68;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-7: 32px;

  --r-xs: 8px;
  --r-sm: 11px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 26px;
  --r-pill: 999px;

  --shadow-card: inset 0 1px 0 rgba(255,255,255,.06), 0 5px 18px rgba(0,0,0,.18);
  --shadow-pop: inset 0 1px 0 rgba(255,255,255,.14), 0 16px 40px rgba(0,0,0,.4);

  /* Motion.  Four durations, because a press and an arrival are not the same
     event: a press has to feel like it happened *now* (.13s), a colour
     settling takes a beat (.22s), a thing moving into place takes longer
     (.42s).  One duration for all three reads either twitchy or sluggish,
     never right - which is a large part of why an untuned UI feels cheap. */
  --dur-press: .13s;
  --dur-fast: .18s;
  --dur: .26s;
  --dur-enter: .42s;
  /* Decelerating: fast off the mark, settling at the end, like a thrown
     object.  --ease-in-out is for colour and opacity, where the ends are not
     a physical event and a symmetric curve looks calmer. */
  --ease: cubic-bezier(.32,.72,0,1);
  --ease-in-out: cubic-bezier(.4,0,.2,1);
  /* How far an arriving element travels, and how long each one waits behind
     the one before it.  --i is the per-item rank: the markup sets it inline,
     and the default here is what an element with no rank gets. */
  --enter-y: 10px;
  --stagger: 24ms;
  --i: 0;

  --inset: 16px;
  --nav-h: 52px;
  --tap: 44px;
  /* Eara's cards are posters: the cover is SQUARE (AlbumGridItem
     .aspectRatio(1f)), 12dp-rounded, floating on a soft depth shadow, and
     the text column under it starts at 16/22 SemiBold with up to three
     lines. These are the reference implementation's own numbers, read from
     its source - not guesses from a screenshot. */
  --thumb-ratio: 1 / 1;
  --card-min: clamp(148px, 43vw, 208px);
}

/* The light-system branch deliberately repeats the dark palette. Existing
   cross-surface token checks can verify both OS configurations without
   treating the absence of an override as proof of consistent colours. */
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: dark;
    --bg: #0a0b0f;
    --surface: #15171e;
    --surface-2: #1e212a;
    --surface-3: #262a34;
    --fill: rgba(255,255,255,.065);
    --fill-strong: rgba(255,255,255,.12);
    --sep: rgba(255,255,255,.085);
    --sep-strong: rgba(255,255,255,.17);
    --nav-bg: #0e1016;
    --text: #f1f3f8;
    --text-2: #a2acbd;
    --text-3: #6e7a8c;
    --text-on-accent: #06101f;
    --accent: #7c9cff;
    --accent-strong: #9b7cf0;
    --accent-soft: rgba(124,156,255,.16);
    --accent-line: rgba(124,156,255,.34);
    --danger: #ff7a7a;
    --danger-soft: rgba(255,122,122,.14);
    --shadow-card: inset 0 1px 0 rgba(255,255,255,.06), 0 5px 18px rgba(0,0,0,.18);
    --shadow-pop: inset 0 1px 0 rgba(255,255,255,.14), 0 16px 40px rgba(0,0,0,.4);
  }
}

/* =====================================================================
   2. BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); min-height: 100%; }

body {
  margin: 0;
  position: relative;
  background: var(--bg);
  background-image: radial-gradient(ellipse 90% 340px at 15% 0%, rgba(124,156,255,.085), transparent 75%);
  background-repeat: no-repeat;
  min-height: 100vh;
  color: var(--text);
  font: var(--fs-body)/var(--lh-body) var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  /* A rubber-banding page shows the shell's own background through it, which
     is where the flash of a different colour came from. */
  overscroll-behavior-y: none;
}

/* The system tap highlight is off because every tappable carries its own
   :active press animation; with only one of the two, taps either double up
   or give no feedback at all. */
body, a, button, input, select, textarea { touch-action: manipulation; }
a, button { -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p, figure { margin: 0; }
img { max-width: 100%; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-xs); }

[hidden] { display: none !important; }
.muted { color: var(--text-2); }
.tnum { font-variant-numeric: tabular-nums; }

/* =====================================================================
   3. LAYOUT
   ===================================================================== */
.wrap {
  position: relative;
  padding: var(--sp-3) var(--inset) calc(var(--sp-6) + env(safe-area-inset-bottom));
}

/* ---- nav bar ---------------------------------------------------------- */
.nav {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: var(--nav-h);
  padding: calc(env(safe-area-inset-top) + var(--sp-1)) var(--inset) var(--sp-1);
  background: var(--glass-sheen), var(--nav-bg);
  border-bottom: 1px solid transparent;
  transition: border-color var(--dur) var(--ease);
}
.nav.is-stuck { border-bottom-color: var(--sep); }
/* Keep the fallback opaque: unsupported blur must not expose sharp text
   underneath. This is the only live blur surface in a scrolling page, and the
   opaque --nav-bg is repeated as the bottom layer of the guarded rule too, so
   the bar still cannot ghost even if a compositor drops the blur. */
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .nav {
    background: var(--glass-sheen), var(--glass-nav), var(--nav-bg);
    -webkit-backdrop-filter: blur(22px) saturate(145%);
    backdrop-filter: blur(22px) saturate(145%);
  }
}

.nav-title {
  flex: 1;
  min-width: 0;
  font-size: var(--fs-headline);
  font-weight: 600;
  letter-spacing: -.012em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  /* The inline title is the large title's stand-in: it fades in as the large
     one scrolls away, which is the entire point of the pattern. A page with
     no large title pins it visible with .nav-title-always. */
  opacity: 0;
  transform: translateY(4px);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.nav.is-stuck .nav-title,
.nav-title-always { opacity: 1; transform: none; }

.nav-mark {
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-on-accent);
  background: linear-gradient(150deg, var(--accent), var(--accent-strong));
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.16);
}
.nav-mark svg { width: 15px; height: 15px; }
.brand-mark { display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 9px; color: var(--text-on-accent);
  background: linear-gradient(150deg, var(--accent), var(--accent-strong));
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.16); }
.brand-ico { width: 15px; height: 15px; }

.icon-btn {
  flex: 0 0 auto;
  width: var(--tap);
  height: var(--tap);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--sep-strong);
  border-radius: var(--r-pill);
  background: var(--glass-sheen), var(--fill);
  color: var(--text);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.09), 0 3px 10px rgba(0,0,0,.12);
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease),
    background-color var(--dur-fast) var(--ease);
}
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn:active { transform: scale(.9); background-color: var(--fill-strong); }
.icon-btn.is-busy svg { animation: skin-spin .7s linear infinite; }
@keyframes skin-spin { to { transform: rotate(360deg); } }

/* ---- large title ------------------------------------------------------
   Not sticky: it is meant to scroll off and hand over to the inline title. */
.page-head { padding: var(--sp-1) var(--inset) var(--sp-4); }
.page-head h1 {
  font-size: var(--fs-large-title);
  font-weight: 700;
  line-height: 1.14;
  letter-spacing: -.024em;
}
.page-head p { margin-top: 5px; font-size: var(--fs-subhead); color: var(--text-2); }

/* =====================================================================
   4. COMPONENTS
   ===================================================================== */

/* ---- filter rail ------------------------------------------------------
   Bled to both edges so it reads as a rail rather than a cut, faded at each
   end, and padded so a pill is never clipped mid-label. */
.chips {
  display: flex;
  gap: var(--sp-2);
  overflow-x: auto;
  overflow-y: hidden;
  margin: 0 calc(var(--inset) * -1) var(--sp-4);
  padding: var(--sp-2) var(--inset) var(--sp-2);
  scroll-padding-inline: var(--inset);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 24px,
    #000 calc(100% - 24px), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 24px,
    #000 calc(100% - 24px), transparent 100%);
}
.chips::-webkit-scrollbar { display: none; }
/* Nothing loaded yet: an empty rail would still spend its bottom margin. */
.chips:empty { display: none; }

.chip {
  position: relative;
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 34px;
  padding: 0 13px;
  border: 1px solid var(--sep);
  border-radius: var(--r-pill);
  background: var(--glass-sheen), var(--fill);
  color: var(--text-2);
  font-size: var(--fs-subhead);
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  transition: transform var(--dur-press) var(--ease),
    background-color var(--dur) var(--ease-in-out),
    color var(--dur) var(--ease-in-out);
}
/* Touch target, not visual size.  A rail of 44px lozenges reads chunky, so
   the pill stays 34px and the tappable box grows to the 44px minimum with
   five invisible pixels above and below.  The rail's own padding-block is
   what keeps the expander inside the scroller's overflow-y: hidden. */
.chip::after {
  content: '';
  position: absolute;
  inset: -5px 0;
}
.chip em { font-style: normal; color: var(--text-3); font-variant-numeric: tabular-nums; }
.chip:active { transform: scale(.95); }

/* Source switch: two pills above the tag rail. The active one is filled
   with the accent — the same selected-voice the reference uses for its
   bottom nav's current item. */
.ds-tabs {
  display: flex;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
}
.ds-tab {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  height: 36px;
  padding: 0 16px;
  border: 1px solid var(--sep);
  border-radius: var(--r-pill);
  background: var(--glass-sheen), var(--fill);
  color: var(--text-2);
  font-size: var(--fs-subhead);
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--dur-press) var(--ease),
    background-color var(--dur) var(--ease-in-out),
    color var(--dur) var(--ease-in-out),
    border-color var(--dur) var(--ease-in-out);
}
.ds-tab:active { transform: scale(.96); }
.ds-tab.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--text-on-accent);
}

/* The asmr.one search row: one input + go button, sitting where a user's
   thumb reaches — directly under the source pills. */
.ds-search {
  display: flex;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
  max-height: 40px;
  overflow: hidden;
  transition: max-height var(--dur) var(--ease), opacity var(--dur) var(--ease),
    margin-bottom var(--dur) var(--ease), visibility 0s;
}
/* The search field belongs to one source only, so switching sources adds or
   removes a block of chrome (94px with the mirror row). `display: none` made
   that a jump of the whole feed; a max-height collapse makes it a movement.
   `visibility` flips at the END of the collapse, so the input leaves the tab
   order with the box and not a frame early. */
.ds-search.is-off, .ds-lines.is-off {
  max-height: 0;
  margin-bottom: 0;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: max-height var(--dur) var(--ease), opacity var(--dur) var(--ease),
    margin-bottom var(--dur) var(--ease), visibility 0s var(--dur);
}
.ds-search input {
  flex: 1 1 auto;
  min-width: 0;
  height: 40px;
  padding: 0 14px;
  border: 1px solid var(--sep);
  border-radius: 12px;
  background: var(--glass-sheen), var(--fill);
  color: var(--text);
  font-size: var(--fs-body);
  -webkit-appearance: none;
  appearance: none;
}
.ds-search input::placeholder { color: var(--text-3); }
.ds-search input:focus { outline: none; border-color: var(--accent); }
.ds-search-go {
  flex: 0 0 auto;
  height: 40px;
  padding: 0 16px;
  border: none;
  border-radius: 12px;
  background: var(--accent);
  color: var(--text-on-accent);
  font-size: var(--fs-subhead);
  font-weight: 600;
  cursor: pointer;
}
.ds-search-go:active { transform: scale(.96); }

/* The mirror lines (asmr.one / -100 / -200 / -300): quiet compact chips so
   the row reads as a setting, not a second source switch — the active line
   takes the same filled voice as the source pill above it. */
.ds-lines {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
  max-height: 30px;
  overflow: hidden;
  transition: max-height var(--dur) var(--ease), opacity var(--dur) var(--ease),
    margin-bottom var(--dur) var(--ease), visibility 0s;
}
.ds-lines-label {
  flex: 0 0 auto;
  font-size: var(--fs-caption);
  color: var(--text-3);
}
.ds-line {
  flex: 0 0 auto;
  height: 30px;
  padding: 0 13px;
  border: 1px solid var(--sep);
  border-radius: var(--r-pill);
  background: var(--glass-sheen), var(--fill);
  color: var(--text-2);
  font-size: var(--fs-caption);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: transform var(--dur-press) var(--ease),
    background-color var(--dur) var(--ease-in-out),
    color var(--dur) var(--ease-in-out),
    border-color var(--dur) var(--ease-in-out);
}
.ds-line:active { transform: scale(.95); }
.ds-line.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--text-on-accent);
}
.chip.is-on { background: linear-gradient(145deg, var(--accent), var(--accent-strong)); color: var(--text-on-accent); font-weight: 600; border-color: var(--glass-edge); box-shadow: inset 0 1px 0 rgba(255,255,255,.24), 0 3px 10px rgba(0,0,0,.15); }
.chip.is-on em { color: inherit; opacity: .66; }

/* ---- section header ---------------------------------------------------
   One component, two page-local names: the pages already ship .ds-sec and
   .pl-sec and their JS and tests speak both. */
.ds-sec, .pl-sec {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
  margin: 0 var(--sp-1) var(--sp-3);
}
.ds-sec[hidden], .pl-sec[hidden] { display: none; }
.ds-sec-title, .pl-sec-title {
  font-size: var(--fs-footnote);
  font-weight: 600;
  letter-spacing: .08em;
  color: var(--text-2);
}
.ds-sec-count, .pl-sec-count {
  font-size: var(--fs-footnote);
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

/* ---- media card ------------------------------------------------------- */
.cover-grid {
  /* A staggered wall, not a row-aligned grid - Eara drives its list with
     StaggeredGridCells.Adaptive, so card heights vary with the text they
     carry and the wall packs tight. CSS columns give the same masonry;
     the skeleton block spans all columns so the loading state keeps the
     full-width grid it always had. */
  columns: 2;
  column-gap: var(--sp-3);
}
/* A source switch keeps the cards that are already on screen and dims them
   while the other source resolves: blanking the feed for a skeleton and then
   refilling it is the blink this removes. The tag rail and the section header
   change with the same data, so they ride the same dim. */
.cover-grid, .chips, .ds-sec { transition: opacity var(--dur) var(--ease); }
.cover-grid.is-switching, .chips.is-switching, .ds-sec.is-switching {
  opacity: .38;
}

.cover-card {
  position: relative;
  display: flex;
  flex-direction: column;
  border-radius: var(--r-md);
  /* The Eara pass: the card is the cover, not a box around it. A glass
     rectangle behind every cover read as one grey slab repeated; the cover
     itself, rounded and set straight on the page, is what a poster wall
     should be. The class keeps its name and its animation contract (the
     motion tests pin the block) - only the chrome is gone.
     Masonry: a card must never split across two columns. */
  break-inside: avoid;
  margin-bottom: var(--sp-4);
  color: inherit;
  /* Offscreen cards still cost paint work unless told not to. */
  content-visibility: auto;
  contain-intrinsic-size: auto 260px;
  transition: transform var(--dur-fast) var(--ease);
}
.cover-card:active { transform: scale(.975); }

.cover-thumb {
  position: relative;
  width: 100%;
  height: auto;
  inset: auto;
  aspect-ratio: var(--thumb-ratio);
  /* With no card surface the rounding belongs to the image itself - 12dp in
     the reference (AlbumGridItemCornerRadius), --r-md here. */
  border-radius: var(--r-md);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  background: var(--surface-3);
  /* AlbumCoverDepthShadow: the cover floats above the page on a soft dark
     pool instead of sitting in a drawn box. */
  box-shadow: 0 12px 28px -10px rgba(0,0,0,.55);
}
.cover-thumb-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
/* Fades the foot of a photo so a bright cover cannot fight the badge row. */
.cover-thumb::after {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 46%;
  pointer-events: none;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.32));
}

/* Placeholder. All eight tints sit in one low-saturation family over the same
   neutral surface. The old set was eight muddy dark gradients - a brown, a
   swamp green, a plum - which read as broken artwork rather than "no image",
   and the initial was a 2.1rem glyph in 34% white on top of it. */
.cover-thumb-fallback {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background-color: var(--surface-3);
  background-image: linear-gradient(150deg,
    rgba(var(--tint, 124,156,255), .20), transparent 72%);
}
.cover-thumb.is-plate .cover-thumb-fallback,
.cover-thumb.has-cover-fallback .cover-thumb-fallback { display: flex; }
.cover-thumb-fallback[hidden] { display: none; }
.plate-0 { --tint: 124,156,255; }
.plate-1 { --tint: 156,138,250; }
.plate-2 { --tint: 104,176,232; }
.plate-3 { --tint: 122,196,186; }
.plate-4 { --tint: 178,146,222; }
.plate-5 { --tint: 118,166,248; }
.plate-6 { --tint: 148,188,158; }
.plate-7 { --tint: 206,168,140; }

.cover-initial {
  position: relative;
  z-index: 1;
  transform: none;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 600;
  color: var(--text-2);
  background: var(--fill);
  border: 1px solid var(--sep);
}

.cover-flag {
  position: absolute;
  right: var(--sp-2);
  bottom: var(--sp-2);
  z-index: 3;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: var(--r-pill);
  font-size: var(--fs-caption);
  font-weight: 600;
  line-height: 1.45;
  color: #fff;
  font-variant-numeric: tabular-nums;
  background: rgba(10,12,18,.66);
  border: 1px solid rgba(255,255,255,.18);
  white-space: nowrap;
}
.cover-flag svg { width: 11px; height: 11px; opacity: .9; }
/* Where Eara pins its play count, this page pins the only measurement the
   source hands over: the duration. Same anatomy - a quiet dark pill in the
   cover's foot, away from the text block. */

.cover-scrim { display: none; }

.cover-info {
  position: static;
  inset: auto;
  left: auto;
  right: auto;
  bottom: auto;
  display: flex;
  flex-direction: column;
  /* AlbumGridItem's info column: h-padding 2dp, v 8dp, 3dp between rows. */
  gap: 4px;
  padding: var(--sp-2) var(--sp-1) 0;
  pointer-events: none;
}
.cover-title {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  /* 16/22 SemiBold, three lines - the reference's own title metrics
     (titleSmall overridden to 16sp/22sp, maxLines 3). */
  -webkit-line-clamp: 3;
  overflow: hidden;
  font-size: var(--fs-headline);
  line-height: 1.4;
  font-weight: 600;
  letter-spacing: -.006em;
  color: var(--text);
}
/* The one colourful row: the source host with a globe glyph in the accent -
   the same prominent-identity voice the reference uses for its CV line,
   while the date (this page's play-count analogue) lives on the cover. */
.cover-meta-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-subhead);
  font-weight: 600;
  white-space: nowrap;
  color: var(--accent);
}
.cover-meta-row svg { width: 13px; height: 13px; flex: 0 0 auto; opacity: .9; }
.cover-src {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* Tag words ride under the title as bare #words in the secondary colour -
   the reference sets its tags to textSecondary with a # prefix, in a Flow
   row. Two clamped lines; long CJK tags wrap, the rest is cut. */
.cover-tags {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  font-size: var(--fs-footnote);
  line-height: 1.6;
  color: var(--text-2);
}
.cover-tag {
  font-style: normal;
  white-space: nowrap;
  margin-right: 10px;
}

/* ---- inset grouped list ----------------------------------------------
   iOS's grouped table: one surface, hairlines inset to the text, rounded at
   the ends. The play page's source rows were separate floating cards with a
   10px gap, which is what made a two-item list look cluttered. */
.play-enter {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 60px;
  margin: 0;
  padding: 11px var(--sp-3);
  border: 1px solid var(--sep);
  border-bottom-width: 0;
  border-radius: 0;
  overflow: hidden;
  background: var(--glass-sheen), var(--surface);
  color: inherit;
  box-shadow: none;
  content-visibility: auto;
  contain-intrinsic-size: auto 60px;
  transition: background-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.play-enter:first-of-type {
  border-top-left-radius: var(--r-lg);
  border-top-right-radius: var(--r-lg);
}
.play-enter:last-of-type {
  border-bottom-width: 1px;
  border-bottom-left-radius: var(--r-lg);
  border-bottom-right-radius: var(--r-lg);
}
.play-enter + .play-enter::before {
  content: "";
  position: absolute;
  /* the hairline starts where the text does: 12px padding + 44px plate + gap */
  left: 68px;
  right: 0;
  top: 0;
  height: 1px;
  background: var(--sep);
}
.play-enter:active { background-color: var(--surface-3); transform: scale(.985); }
.play-enter.is-primary { background: var(--glass-sheen), linear-gradient(110deg, var(--accent-soft), var(--surface)); }
.play-enter.is-primary::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--accent);
}
.play-enter:hover { transform: none; }

/* The in-app playback affordance: a compact accent pill at the row's right
   edge, inside the same <a> row. Tapping it must not also jump to the embed
   page (the page script stops the propagation); visually it reads as
   "this source can also play right here" without stealing the row tap. */
.play-enter.is-inapp { cursor: pointer; }
.play-inapp {
  flex: 0 0 auto;
  margin-left: auto;
  padding: 5px 11px;
  border: 1px solid var(--accent-line);
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font: inherit;
  font-size: var(--fs-caption);
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.play-inapp:active { transform: scale(.96); background: var(--accent-line); }
/* With the pill present the chevron is dropped (the JS omits it) and the
   hairline still starts at the icon, so nothing else changes. */

/* A multi-track work gets one strip above the list: the whole queue in a
   single tap. It reads as the list's head rather than another source row —
   accent-washed, taller, no hairline — so it cannot be mistaken for a
   playable source of its own. */
.play-queuebar {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  margin: 0 0 var(--sp-3);
  padding: 11px 14px;
  border: 1px solid var(--accent-line);
  border-radius: var(--r-md);
  background: var(--glass-sheen), var(--accent-soft);
  color: var(--accent);
  font: inherit;
  font-size: var(--fs-subhead);
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.play-queuebar:active { transform: scale(.985); background: var(--accent-line); }
.play-queuebar svg { flex: 0 0 auto; width: 15px; height: 15px; }
.play-queuebar .pl-qc {
  margin-left: auto;
  color: var(--text-2);
  font-size: var(--fs-caption);
  font-weight: 400;
}

/* The per-track "+" (Eara's addedToQueue): a second, quieter affordance next
   to the in-app pill. The tick is the whole confirmation — the page does not
   navigate, so nothing else would tell the user the tap landed. */
.play-addq {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  margin-left: 6px;
  padding: 0;
  border: 1px solid var(--sep-strong);
  border-radius: var(--r-pill);
  background: transparent;
  color: var(--text-2);
  font: inherit;
  font-size: var(--fs-headline);
  line-height: 1;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease),
    color var(--dur-fast) var(--ease);
}
.play-addq:active { transform: scale(.92); background: var(--accent-soft); color: var(--accent); }
.play-addq.is-added {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: var(--accent);
  font-size: var(--fs-body);
}

.src-ico {
  position: relative;
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  border-radius: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  background: var(--glass-sheen), var(--accent-soft);
  border: 1px solid var(--accent-line);
  box-shadow: inset 0 1px 0 var(--glass-highlight), 0 3px 8px rgba(0,0,0,.12);
}
.src-ico svg { width: 19px; height: 19px; }
.play-enter.is-primary .src-ico {
  background: linear-gradient(145deg, var(--accent), var(--accent-strong));
  color: var(--text-on-accent);
  border-color: transparent;
}
.src-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.play-enter strong {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-width: 0;
  font-size: var(--fs-body);
  font-weight: 600;
  letter-spacing: -.008em;
}
/* The name owns this line: it is what the row IS, so it takes what is left
   and ellipsises instead of wrapping. The folder path used to be joined into
   this slot and a work whose folders read 「06: 特典 · 03: 闹钟音频 · 01_mp3」
   grew every row to five lines — the name sat at the end of the paragraph. */
.src-name {
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.src-badge {
  flex: 0 0 auto;
  padding: 2.5px 8px;
  border-radius: var(--r-pill);
  font-size: var(--fs-caption);
  font-weight: 700;
  color: var(--text-on-accent);
  background: var(--accent);
}
.src-host {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  font-size: var(--fs-footnote);
  color: var(--text-2);
  white-space: nowrap;
}
.src-host svg { flex: 0 0 auto; width: 11px; height: 11px; opacity: .85; }
/* One line, always: a CDN host plus a folder plus 应用内 is wider than the
   row, and wrapping it is what turned the meta line into a three-line stack
   under a name that had already been pushed out of its own line. */
.src-meta {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.src-chev {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  color: var(--text-3);
  transition: transform var(--dur) var(--ease), color var(--dur) var(--ease);
}
.play-enter:active .src-chev { transform: translateX(3px); color: var(--accent); }
.play-enter.is-loading .src-ico svg,
.play-enter[aria-busy="true"] .src-ico svg { opacity: 0; }
.play-enter.is-loading .src-ico::after,
.play-enter[aria-busy="true"] .src-ico::after {
  content: "";
  position: absolute;
  width: 20px;
  height: 20px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-bottom-color: transparent;
  border-radius: 50%;
  animation: skin-spin .8s linear infinite;
}

/* ---- buttons ---------------------------------------------------------- */
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: var(--tap);
  padding: 0 var(--sp-4);
  border: 1px solid transparent;
  border-radius: var(--r-md);
  background: var(--glass-sheen), var(--fill);
  color: var(--text);
  font-size: var(--fs-headline);
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease),
    opacity var(--dur-fast) var(--ease),
    background-color var(--dur-fast) var(--ease);
}
.button svg { width: 15px; height: 15px; }
.button:active { transform: scale(.97); opacity: .85; }
.button:disabled { opacity: .38; }
.button-primary { background: linear-gradient(145deg, var(--accent), var(--accent-strong)); color: var(--text-on-accent); border-color: var(--glass-edge); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 4px 14px rgba(0,0,0,.16); }
.button-secondary, .button-ghost { background: var(--glass-sheen), var(--fill); color: var(--text); border-color: var(--sep-strong); }
.button-danger { background: var(--danger-soft); color: var(--danger); }

.ds-pager { display: flex; gap: var(--sp-2); margin-top: var(--sp-5); }
.ds-pager[hidden] { display: none; }
.ds-pager .button { flex: 1 1 0; min-width: 0; border-color: var(--sep); }

/* Small pill link, used by the play page's footer row. */
.glass-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 13px;
  border: 1px solid var(--sep);
  border-radius: var(--r-pill);
  background: var(--glass-sheen), var(--fill);
  color: var(--text-2);
  font-size: var(--fs-subhead);
  font-weight: 500;
  transition: transform var(--dur-fast) var(--ease),
    background-color var(--dur-fast) var(--ease);
}
.glass-chip:active { transform: scale(.95); }
.glass-chip svg { width: 13px; height: 13px; opacity: .85; }

/* ---- states ----------------------------------------------------------- */
/* .glass-panel survives as a plain container: it used to be a blurred glass
   card, which made an error message look like a floating widget. */
.glass-panel { background: transparent; border: 0; box-shadow: none; }

.err-hero {
  min-height: 52vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--sp-7) var(--sp-3);
}
.err-glyph {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: var(--sp-4);
  color: var(--text-2);
  background: var(--glass-sheen), var(--surface);
  border: 1px solid var(--glass-edge);
  box-shadow: var(--shadow-pop);
}
.err-glyph svg { width: 32px; height: 32px; color: var(--accent); }
.err-title { font-size: var(--fs-title); font-weight: 700; letter-spacing: -.016em; color: var(--text); }
.err-sub {
  margin-top: 7px;
  max-width: 30em;
  font-size: var(--fs-subhead);
  line-height: var(--lh-relaxed);
  color: var(--text-2);
}
/* Centred CJK wraps badly on its own: a break can land between the two
   characters of a word, which is what left a two-character orphan on its own
   line.  `text-wrap: pretty` is the fix, but the shipped WebView is Chrome 113
   and only 117+ implements it - written bare it is silently dropped.  Behind
   @supports it costs nothing today and starts working when the system WebView
   updates; until then the copy keeps each <br> segment inside one line. */
@supports (text-wrap: pretty) {
  .err-sub { text-wrap: pretty; }
}
.err-actions {
  display: flex;
  gap: var(--sp-2);
  flex-wrap: wrap;
  justify-content: center;
  margin-top: var(--sp-5);
}
.err-actions .button { min-width: 132px; border-radius: var(--r-md); }
.err-link { margin-top: var(--sp-4); font-size: var(--fs-footnote); }

/* ---- inline proxy row in the error panel ------------------------------- */
/* The site's TLS is reset by the firewall from inside mainland networks
 * without a VPN, and the phone WiFi proxy path does not reach the WebView's
 * own network stack — so the error panel exposes an in-app proxy form that
 * pushes host+port into the JVM via the bridge. Lives inside `.err-hero`
 * like a small drawer: one line of state when closed, a two-field form
 * with a save-and-retry button when open. */
.ds-proxy {
  margin-top: var(--sp-4);
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: var(--fs-footnote);
  color: var(--text-2);
}
.ds-proxy-state {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--text);
  border: 1px solid var(--accent-line);
  font-variant-numeric: tabular-nums;
}
.ds-proxy-state-empty {
  background: var(--fill);
  color: var(--text-2);
  border-color: var(--sep);
}
.ds-proxy-clear {
  border: none;
  background: transparent;
  color: inherit;
  font-size: 14px;
  line-height: 1;
  padding: 0 2px;
  cursor: pointer;
  opacity: 0.7;
}
.ds-proxy-toggle {
  border: 1px solid var(--sep);
  background: var(--fill);
  color: var(--text);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: var(--fs-footnote);
  cursor: pointer;
}
.ds-proxy-form {
  margin-top: var(--sp-3);
  display: grid;
  gap: var(--sp-2);
  width: min(320px, 100%);
  padding: var(--sp-3);
  border-radius: var(--r-md);
  background: var(--fill);
  border: 1px solid var(--sep);
  /* Subtle entrance: pops in rather than flashing into existence. */
  animation: ds-fade-in 180ms var(--ease) backwards;
}
.ds-proxy-field {
  display: grid;
  grid-template-columns: 56px 1fr;
  align-items: center;
  gap: var(--sp-2);
  font-size: var(--fs-footnote);
  color: var(--text-2);
}
.ds-proxy-field input {
  width: 100%;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid var(--sep);
  background: var(--bg);
  color: var(--text);
  font: inherit;
  font-variant-numeric: tabular-nums;
  font-size: 14px;
  /* iOS / Android keyboards do not always honour inputmode; this nudges
   * numeric/host-typing layouts on the keyboards that do. */
  outline: none;
}
.ds-proxy-field input:focus {
  border-color: var(--accent-line);
}
.ds-proxy-hint {
  margin: 0;
  font-size: var(--fs-footnote);
  color: var(--text-2);
}
.ds-proxy-actions {
  display: flex;
  gap: var(--sp-2);
  justify-content: flex-end;
  margin-top: 2px;
}
.ds-proxy-actions .button {
  padding: 6px 14px;
  border-radius: 10px;
  font-size: var(--fs-footnote);
  min-width: 0;
}
@keyframes ds-fade-in {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---- skeleton --------------------------------------------------------- */
/* One shimmer keyframe, shared: both pages drive their skeletons off it. */
@keyframes ds-skeleton { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.sk {
  background-image: linear-gradient(100deg, var(--fill) 20%, var(--fill-strong) 38%, var(--fill) 56%);
  background-size: 220% 100%;
  animation: ds-skeleton 1.35s ease-in-out infinite;
}

#ds-grid > .live-skeleton-grid {
  column-span: all;
  display: grid;
  grid-column: 1 / -1;
  width: 100%;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--card-min)), 1fr));
  gap: var(--sp-4);
  padding: 0;
  align-content: start;
}
.live-skeleton-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--sep);
  border-radius: var(--r-lg);
  background: var(--surface);
}
.live-skeleton-card::before {
  content: "";
  display: block;
  flex: 0 0 auto;
  aspect-ratio: var(--thumb-ratio);
}
.live-skeleton-card::before,
.live-skeleton-card i {
  background-image: linear-gradient(100deg, var(--fill) 20%, var(--fill-strong) 38%, var(--fill) 56%);
  background-size: 220% 100%;
  animation: ds-skeleton 1.35s ease-in-out infinite;
}
.live-skeleton-card i {
  display: block;
  height: 10px;
  flex: 0 0 10px;
  margin: 12px var(--sp-3) 0;
  border-radius: 5px;
}
.live-skeleton-card i:last-child { width: 54%; margin-bottom: 13px; }

.pl-skel { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-2) 0 var(--sp-1); }
.pl-skel::before {
  content: "";
  display: block;
  flex: 0 0 32px;
  width: 32px;
  height: 32px;
  margin: var(--sp-4) auto var(--sp-5);
  border: 2px solid var(--accent-line);
  border-top-color: var(--accent);
  border-right-color: var(--accent-strong);
  border-radius: 50%;
  animation: skin-spin .85s linear infinite;
}
.pl-skel-row {
  /* Reuse the same shimmer as the discover page skeleton so the loading
   * rhythm looks the same.  Without a background the row was a 60px tall
   * transparent box - dark mode invisible, light mode washed into the
   * page - and on top of that the row lived inside a <p>, which the
   * parser auto-closes around the inner <div> so the wrapper went
   * `:empty { display: none }` and the skeleton never rendered at all.
   */
  height: 60px;
  border-radius: var(--r-lg);
  background-image: linear-gradient(100deg,
    var(--fill) 20%, var(--fill-strong) 38%, var(--fill) 56%);
  background-size: 220% 100%;
  animation: ds-skeleton 1.35s ease-in-out infinite;
}

.ds-status, .pl-status {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  margin: var(--sp-3) 0 0;
  font-size: var(--fs-footnote);
  color: var(--text-2);
  text-align: center;
}
.ds-status:empty, .pl-status:empty { display: none; }
.ds-status.is-loading::before, .pl-status.is-loading::before {
  content: "";
  flex: 0 0 16px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid var(--accent-line);
  border-top-color: var(--accent);
  border-right-color: var(--accent);
  animation: skin-spin .8s linear infinite;
}
@keyframes skin-pulse { 50% { opacity: .3; transform: scale(.7); } }

/* The launch mark is alive while data is loading: its four bars breathe in
   sequence inside a glass tile. No layout or blur is animated. */
.ds-splash .ds-splash-glyph {
  overflow: hidden;
  color: var(--accent);
  background: var(--glass-sheen), var(--surface-2);
  border: 1px solid var(--glass-edge);
  border-radius: 19px;
  box-shadow: var(--shadow-pop);
  animation: skin-float 2.4s var(--ease-in-out) infinite;
}
.ds-splash .ds-splash-glyph::after {
  content: "";
  position: absolute;
  inset: -40%;
  background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.16) 49%, transparent 63%);
  transform: translateX(-80%) rotate(10deg);
  animation: skin-glint 3s var(--ease-in-out) infinite;
  pointer-events: none;
}
.ds-splash-glyph rect {
  transform-box: fill-box;
  transform-origin: center;
  animation: skin-wave .95s ease-in-out infinite alternate;
}
.ds-splash-glyph rect:nth-child(2) { animation-delay: -.2s; }
.ds-splash-glyph rect:nth-child(3) { animation-delay: -.4s; }
.ds-splash-glyph rect:nth-child(4) { animation-delay: -.6s; }
@keyframes skin-wave { from { transform: scaleY(.4); opacity: .55; } to { transform: scaleY(1); opacity: 1; } }
@keyframes skin-float { 50% { transform: translateY(-3px); } }
@keyframes skin-glint { 55%, 100% { transform: translateX(80%) rotate(10deg); } }

/* =====================================================================
   5. MOTION
   Motion is what separates a list of things from an interface.  A card that
   is already on screen when you arrive needs no animation; a card that
   arrives *because you tapped* does, because otherwise the tap appears to
   have done nothing until the whole batch is there at once.

   Everything below is transform and opacity only, so it stays on the
   compositor: an animation that forces layout would drop frames exactly
   while images are decoding, which is when it is least affordable.
   ===================================================================== */
@keyframes skin-rise {
  from { opacity: 0; transform: translate3d(0, var(--enter-y), 0); }
  to   { opacity: 1; transform: translate3d(0, 0, 0); }
}

/* ---- arrival ---------------------------------------------------------
   Cards cascade in.  `backwards` is load-bearing: without it a card is fully
   painted during its own delay and then snaps back to the start of the
   animation, which is worse than no animation at all. */
.cover-card {
  animation: skin-rise var(--dur-enter) var(--ease) backwards;
  animation-delay: calc(min(var(--i, 0), 9) * var(--stagger));
}
/* Page-level arrivals: the error hero and the play page's hero. */
.err-hero, .pl-hero { animation: skin-rise var(--dur-enter) var(--ease) backwards; }
/* Source rows cascade like cards, one rank lower in the hierarchy. */
.play-enter {
  animation: skin-rise var(--dur-enter) var(--ease) backwards;
  animation-delay: calc(min(var(--i, 0), 7) * var(--stagger));
}

/* ---- press -----------------------------------------------------------
   Press-in is quicker than the release, on every tappable.  The finger wants
   the change immediately; the spring back is the part worth watching.  Each
   selector already declares its own transition, so this only overrides the
   duration - and only while the press is held. */
.icon-btn:active, .chip:active, .cover-card:active,
.button:active, .glass-chip:active, .play-enter:active {
  transition-duration: var(--dur-press);
}

/* ---- reduced motion ---------------------------------------------------
   Targeted rather than a blanket override, and it removes *travel* while
   keeping *feedback* - the same trade iOS's Reduce Motion makes.  Blanket
   overrides are wrong here for two reasons: the pull-to-refresh arc fill is a
   transition that carries information (the pull distance) and the page
   contracts pin it as staying, and killing every transition also kills the
   press states, which leaves a UI with no response to touch at all. */
@media (prefers-reduced-motion: reduce) {
  .sk, .live-skeleton-card::before, .live-skeleton-card i,
  .pl-skel-row, .ds-status.is-loading::before,
  .pl-status.is-loading::before { animation: none; }
  .icon-btn.is-busy svg, .ds-splash .ds-splash-glyph,
  .ds-splash-glyph rect, .ds-splash .ds-splash-glyph::after, .pl-skel::before,
  .play-enter.is-loading .src-ico::after,
  .play-enter[aria-busy="true"] .src-ico::after { animation: none; }
  .ds-splash .ds-splash-glyph::after { opacity: 0; }
  .play-enter:active .src-chev { transform: none; }
  /* No travel: the element is simply there, at its final position. */
  .cover-card, .err-hero, .pl-hero, .play-enter { animation: none; }
  .icon-btn:active, .chip:active, .cover-card:active,
  .button:active, .glass-chip:active, .play-enter:active { transform: none; }
  .button:active { opacity: .7; }
  /* The card's press answer used to be a border lighting up, but the card
     has no border anymore - so travel-free feedback is a dim of the cover. */
  .cover-card:active { opacity: .7; }
  /* A source switch moves the page: the chrome collapses by ~94px and the
     feed changes height under it. Reduce Motion means the rows are simply
     there, or not — so the collapse itself is dropped and only the fade is
     kept, because a fade is not travel. The pull arc is deliberately NOT
     listed: its transition reports the pull distance and stays. */
  .ds-search, .ds-lines { transition: opacity var(--dur) var(--ease); }
}
@media (prefers-reduced-transparency: reduce) {
  .nav {
    background: var(--nav-bg);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
}

/* =====================================================================
   play page
   ===================================================================== */

/* Two layout rules learned from the phone screenshots:
   1. the desktop skin padded body/wrap for its 4-tab dock, which this page
      does not have - neutralising both is where the dead black band under the
      sources came from;
   2. an empty #pl-status still carried its padding, adding a second gap
      between the hero and the source list - :empty removes it outright. */
.play-page { padding-bottom: env(safe-area-inset-bottom); }
.play-page .wrap { padding-top: .9rem;
  padding-bottom: calc(1.4rem + env(safe-area-inset-bottom)); }
@media (max-width: 767px) {
  .play-page { padding-bottom: env(safe-area-inset-bottom); }
  .play-page .wrap { padding-top: .7rem;
    padding-bottom: calc(1.4rem + env(safe-area-inset-bottom)); }
}

/* "直链播放" is a property of the page, not an action, so it sits in the bar
   as a quiet tinted pill rather than a button the user will try to tap. */
.glass-badge {
  flex: 0 0 auto;
  padding: 4px 10px;
  border-radius: var(--r-pill);
  font-size: var(--fs-caption);
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
}

/* ---- cover hero -------------------------------------------------------
   The reference detail page's hero, from its own source: a full-bleed
   fixed-height artwork block (AlbumDetailScreen: heroMinHeight 280dp,
   preferred 360dp) whose foot melts into the page through a colour ramp,
   with the title riding the melt. The old boxed 16/9 stamp read as a
   thumbnail pretending to be a hero; this is the artwork owning the page. */
.pl-hero { position: relative; margin: 0 calc(var(--inset) * -1) var(--sp-2);
  height: clamp(250px, 66vw, 380px);
  overflow: hidden; background: var(--surface-3); }
.pl-hero-img { position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; }
.pl-hero-scrim { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(10,11,15,0) 34%,
  rgba(10,11,15,.58) 66%, var(--bg) 100%); }
.pl-hero-body { position: absolute; left: 0; right: 0; bottom: 0;
  padding: var(--sp-3) var(--sp-4) var(--sp-4);
  display: flex; flex-direction: column; gap: 6px; }
.pl-hero-title { font-size: 23px; font-weight: 700;
  line-height: 1.32; letter-spacing: -.014em; color: #fff;
  text-shadow: 0 2px 12px rgba(0,0,0,.6); }
.pl-hero-meta { display: inline-flex; align-items: center; gap: 6px;
  color: rgba(255,255,255,.74); font-size: var(--fs-footnote); }
.pl-hero-meta svg { width: 12px; height: 12px; opacity: .85; }
/* The origin rides above the title as a chip: the page must say which source
   it is showing, because the two behave differently (one plays here, the
   other's embeds leave for a page). Black glass with light text — the same
   treatment every other chip that sits on artwork gets — because the scrim
   has barely started this high up the hero and an accent tint on a bright
   cover was unreadable. */
.pl-hero-src { align-self: flex-start; padding: 4px 11px;
  border: 1px solid var(--glass-edge); border-radius: var(--r-pill);
  background: var(--glass-sheen), rgba(10,11,15,.66); color: #fff;
  font-size: var(--fs-caption); font-weight: 700; letter-spacing: .04em; }
/* no cover came over from the card: brand plate + static (non-overlaid) text,
   in theme colours so it works in light mode too. The variant keeps the
   full-bleed foot so both hero shapes share one silhouette. */
.pl-hero.no-cover { background: linear-gradient(150deg, var(--accent-soft), var(--surface) 62%); }
.pl-hero.no-cover .pl-hero-body { position: static; padding: var(--sp-6) var(--sp-4) var(--sp-5); }
.pl-hero.no-cover .pl-hero-title { color: var(--text); text-shadow: none; }
.pl-hero.no-cover .pl-hero-meta { color: var(--text-3); }

/* ---- footer ----------------------------------------------------------- */
.play-foot { margin-top: var(--sp-5); padding-top: var(--sp-4);
  border-top: 1px solid var(--sep); }
.play-links { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.play-hint { display: flex; align-items: flex-start; gap: var(--sp-2);
  margin-top: var(--sp-4); font-size: var(--fs-footnote);
  line-height: var(--lh-relaxed); color: var(--text-2); }
.play-hint svg { flex-shrink: 0; width: 15px; height: 15px; margin-top: 2px;
  color: var(--accent); }

/* ---- play page: tablet -------------------------------------------------
   The phone layout is one column: 16/9 hero, then the source rows, then the
   footer, each at the wrap's full width. On a tablet that is wrong twice
   over - the footer's hint line runs to 1120px (unreadable), and at 800px
   portrait the hero grows taller than the list it is introducing.
   Narrow tablets keep the stack but stop it growing: capped at 760px, one
   larger type scale, wider rows. From 900px the hero moves into its own
   column beside the source list and stays there while the list scrolls, and
   the wrap is capped at 1120px so nothing runs to 1280px.
   The split is gated on :has() rather than on #pl-dock because keying the
   columns on the dock would leave an empty left column through the whole
   resolve; keyed on the hero, the resolve keeps the phone's full-width
   skeleton and the split appears only once there is a hero to put in it.
   :has() degrades to the stacked layout on an older WebView. */
@media (min-width: 768px) and (max-width: 899px) {
  .play-page .wrap { max-width: 760px; margin-inline: auto; padding-inline: var(--sp-6); }
  /* Back to the boxed hero: a centred column has no edge to bleed to, and a
     ramp that melts into the page only reads full-bleed. Static 16/9 art,
     darkening scrim inside the box. */
  .pl-hero { margin: 0 0 var(--sp-5); height: auto; border-radius: var(--r-xl); }
  .pl-hero-img { position: static; width: 100%; height: auto; aspect-ratio: 16 / 9; }
  .pl-hero-scrim { background: linear-gradient(180deg, rgba(0,0,0,0) 34%,
    rgba(0,0,0,.55) 66%, rgba(0,0,0,.9) 100%); }
  .pl-hero-title { font-size: 23px; }
  .pl-hero-meta { font-size: var(--fs-subhead); }
  .pl-hero.no-cover .pl-hero-body { padding: var(--sp-7) var(--sp-5) var(--sp-6); }
  .play-enter { padding: var(--sp-3) var(--sp-4); contain-intrinsic-size: auto 68px; }
  .play-enter strong { font-size: var(--fs-headline); }
  .src-ico { width: 48px; height: 48px; border-radius: 14px; }
  .src-ico svg { width: 21px; height: 21px; }
  .src-host { font-size: var(--fs-subhead); }
  .play-hint { font-size: var(--fs-subhead); }
  /* the hairline follows the text start, which moves with the icon */
  .play-enter + .play-enter::before { left: 76px; }
}
@media (min-width: 900px) {
  .play-page .wrap { max-width: 1120px; margin-inline: auto; padding-inline: var(--sp-6); }
  .play-page .wrap:has(> #pl-hero:not([hidden])) {
    display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    gap: var(--sp-5) var(--sp-7); align-items: start; }
  .play-page .wrap:has(> #pl-hero:not([hidden])) > .pl-hero {
    grid-column: 1; grid-row: 1 / -1; margin: 0;
    border-radius: var(--r-xl);
    /* sticky, not fixed: it tracks the source list and lets go at its end */
    position: sticky; top: 74px; }
  .pl-hero { height: auto; }
  .pl-hero-img { position: static; width: 100%; height: auto; aspect-ratio: 16 / 9; }
  .pl-hero-scrim { background: linear-gradient(180deg, rgba(0,0,0,0) 34%,
    rgba(0,0,0,.55) 66%, rgba(0,0,0,.9) 100%); }
  /* the dock's own side padding would double up on the grid gap */
  .play-page .wrap:has(> #pl-hero:not([hidden])) > #pl-dock {
    grid-column: 2; grid-row: 1;
    padding: 0 0 calc(var(--sp-1) + env(safe-area-inset-bottom)); }
  .play-page .wrap > #pl-error { grid-column: 1 / -1; }
  .pl-hero-title { font-size: 23px; }
  .pl-hero-meta { font-size: var(--fs-subhead); }
  .play-enter { padding: var(--sp-3) var(--sp-4); contain-intrinsic-size: auto 68px; }
  .play-enter strong { font-size: var(--fs-headline); }
  .src-ico { width: 48px; height: 48px; border-radius: 14px; }
  .src-ico svg { width: 21px; height: 21px; }
  .src-host { font-size: var(--fs-subhead); }
  .play-foot { margin-top: var(--sp-5); }
  .play-hint { font-size: var(--fs-subhead); }
  .play-enter + .play-enter::before { left: 76px; }
}
/* landscape is the short case: buy back vertical room for the source rows */
@media (min-width: 900px) and (orientation: landscape) {
  .play-page .wrap { padding-top: .8rem; }
  .play-page .wrap:has(> #pl-hero:not([hidden])) { gap: var(--sp-4) var(--sp-7); }
}
</style>

    } else if (act === 'play-inapp') {
      // In-app playback: hand the stream to the native player through the
      // bridge. The cover rides along for the artwork backdrop; the source
      // page is the Referer the player host expects.  A multi-track resolve
      // (asmr.one works) goes as one queue so the player can continue.
      var b2 = window.__asmrlibDiscover;
      if (!b2) return;
      var entry = postEntry();
      var qTitle = entry.t || titleEl.textContent || '在线播放';
      var qReferer = btn.getAttribute('data-referer') || '';
      var qi = parseInt(btn.getAttribute('data-qi'), 10);
      if (b2.playDirectQueue && playQueue.length > 1 && qi >= 0) {
        b2.playDirectQueue(JSON.stringify(playQueue), qi, qTitle, entry.c || '', qReferer);
      } else if (b2.playDirect) {
        b2.playDirect(btn.getAttribute('data-url'),
          btn.getAttribute('data-kind'),
          qTitle,
          entry.c || '',
          qReferer);
      }
    }
  });
  // The strip and the per-row "+" share the queue launch; only the entry
  // index differs. The page stays put — the player opens over it — and the
  // added row shows a tick, which is the whole feedback (Eara's addedToQueue).
  dockEl.addEventListener('click', function (ev) {
    var t = ev.target.closest
      ? (ev.target.closest('[data-action="play-queue"]')
        || ev.target.closest('[data-action="queue-add"]')) : null;
    if (!t) return;
    ev.preventDefault();
    ev.stopPropagation();
    var bq = window.__asmrlibDiscover;
    if (!bq || !bq.playDirectQueue || playQueue.length < 2) return;
    var entryQ = postEntry();
    var titleQ = entryQ.t || titleEl.textContent || '在线播放';
    var qiQ = t.hasAttribute('data-qi') ? parseInt(t.getAttribute('data-qi'), 10) : 0;
    bq.playDirectQueue(JSON.stringify(playQueue), qiQ, titleQ,
      entryQ.c || '', t.getAttribute('data-referer') || '');
    if (t.getAttribute('data-action') === 'queue-add') {
      t.classList.add('is-added');
      t.textContent = '✓';
      t.setAttribute('aria-pressed', 'true');
    }
  });
  // The in-app button sits inside the row's <a>; without this a tap would
  // both play in-app AND jump to the embed page.
  dockEl.addEventListener('click', function (ev) {
    var pill = ev.target.closest
      ? ev.target.closest('[data-action="play-inapp"],[data-action="embed-play"]') : null;
    if (!pill) return;
    ev.preventDefault();
    ev.stopPropagation();
    if (pill.getAttribute('data-action') === 'embed-play') {
      playEmbed(pill.closest('.play-enter') || pill);
      return;
    }
    var b = window.__asmrlibDiscover;
    if (!b) return;
    var entry = postEntry();
    var qTitle = entry.t || titleEl.textContent || '在线播放';
    var qReferer = pill.getAttribute('data-referer') || '';
    var qi = parseInt(pill.getAttribute('data-qi'), 10);
    if (b.playDirectQueue && playQueue.length > 1 && qi >= 0) {
      b.playDirectQueue(JSON.stringify(playQueue), qi, qTitle, entry.c || '', qReferer);
    } else if (b.playDirect) {
      b.playDirect(pill.getAttribute('data-url'),
        pill.getAttribute('data-kind'),
        qTitle,
        entry.c || '',
        qReferer);
    }
  });
  // The row around it is the same action over a much bigger target: a tap
  // anywhere on a media row plays that track. Anything carrying its own
  // data-action (the pill, the "+") is left to its own handler.
  dockEl.addEventListener('click', function (ev) {
    if (!ev.target.closest) return;
    if (ev.target.closest('[data-action]')) return;
    var row = ev.target.closest('.play-enter[data-inapp]');
    if (!row) return;
    ev.preventDefault();
    if (row.hasAttribute('data-embed')) {
      playEmbed(row);
      return;
    }
    var b = window.__asmrlibDiscover;
    if (!b) return;
    var entryR = postEntry();
    var titleR = entryR.t || titleEl.textContent || '在线播放';
    var qi = parseInt(row.getAttribute('data-qi'), 10);
    var refererR = row.getAttribute('data-referer') || '';
    if (b.playDirectQueue && playQueue.length > 1 && qi >= 0) {
      b.playDirectQueue(JSON.stringify(playQueue), qi, titleR, entryR.c || '', refererR);
    } else if (b.playDirect) {
      b.playDirect(row.getAttribute('data-url'), row.getAttribute('data-kind'),
        titleR, entryR.c || '', refererR);
    }
  });
  // ---- embed resolve on tap ------------------------------------------
  // An embed row's URL addresses a player page, not media bytes, so the
  // tap first asks the bridge to sniff the page in a hidden WebView. While
  // it runs the row shows the same spinner a loading card does; on success
  // the sniffed stream goes straight into the same player every other row
  // uses; on failure the row rewinds into the plain external link this page
  // shipped with before the unified player existed.
  function playEmbed(row) {
    var b = window.__asmrlibDiscover;
    if (!b || !b.resolveEmbed) {
      degradeEmbedRow(row);
      return;
    }
    if (row.getAttribute('aria-busy') === 'true') return;
    row.setAttribute('aria-busy', 'true');
    row.classList.add('is-loading');
    embedSeq += 1;
    var id = 'e' + embedSeq + '-' + Math.floor(Math.random() * 1e6);
    embedPending[id] = row;
    b.resolveEmbed(row.getAttribute('data-url') || '',
      row.getAttribute('data-referer') || '', id);
  }
  function handleEmbedResult(row, payloadJson) {
    row.classList.remove('is-loading');
    row.removeAttribute('aria-busy');
    var res = null;
    try { res = JSON.parse(String(payloadJson == null ? '' : payloadJson)); }
    catch (e) { res = null; }
    var b = window.__asmrlibDiscover;
    var kind = res && res.kind;
    if (!res || !res.ok || !res.url
      || (kind !== 'hls' && kind !== 'direct') || !b || !b.playDirectQueue) {
      degradeEmbedRow(row);
      return;
    }
    var entry = postEntry();
    var nameEl = row.querySelector ? row.querySelector('.src-name') : null;
    var track = [{ u: res.url, l: nameEl ? nameEl.textContent : '', k: kind }];
    if (res.referer) track[0].rr = res.referer;
    // One-entry queue, tapped at 0 — the same launch path a native row
    // takes, so the pinned Referer ("rr") survives to StreamProxy untouched.
    b.playDirectQueue(JSON.stringify(track), 0,
      entry.t || titleEl.textContent || '在线播放',
      entry.c || '', row.getAttribute('data-referer') || '');
  }
  function degradeEmbedRow(row) {
    if (!row || !row.parentNode) return;
    var idx = parseInt(row.getAttribute('data-src-index'), 10);
    var s = lastSources[idx];
    var name = s ? String(s.label || ('源' + (idx + 1))).trim() : '播放源';
    var host = s
      ? String(s.url).replace(/^https?:\/\//, '').split('/')[0] : '';
    var a = document.createElement('a');
    a.className = 'play-enter';
    if (s && s.url) a.href = s.url;
    a.innerHTML = '<span class="src-ico" aria-hidden="true">' + ICON_PLAY + '</span>'
      + '<span class="src-body"><strong><span class="src-name">' + esc(name)
      + '</span></strong><span class="src-host">' + ICON_GLOBE
      + '<span class="src-meta">' + esc(host) + ' · 网页播放</span></span></span>'
      + '<span class="src-chev" aria-hidden="true">›</span>';
    row.replaceWith(a);
  }
  errEl.addEventListener('submit', function (ev) {
    var form = ev.target.closest
      ? ev.target.closest('[data-action="proxy-form"]') : null;
    if (!form) return;
    ev.preventDefault();
    var host = (form.host.value || '').trim();
    var port = parseInt(form.port.value, 10) || 0;
    if (!host || port <= 0 || port > 65535) return;
    var b = window.__asmrlibDiscover;
    if (b && b.setProxy) b.setProxy(host, port);
    errEl.hidden = true;
    load(0);
  });

  // Results land here from the native bridge (background fetch, UI-thread
  // evaluateJavascript). Unknown ids are stale deliveries from an abandoned
  // request or a previous page — ignored. Embed-resolve ids are answered on
  // their row instead of the page-level panels.
  window.__asmrlibDeliver = function (id, payloadJson) {
    var erow = embedPending[id];
    if (erow) {
      delete embedPending[id];
      try { handleEmbedResult(erow, payloadJson); } catch (e) {
        degradeEmbedRow(erow);
      }
      return;
    }
    var entry = pending[id];
    if (!entry) return;
    delete pending[id];
    if (entry.busy) clearTimeout(entry.busy);
    var post = entry.post;
    var res = null;
    try { res = JSON.parse(String(payloadJson == null ? '' : payloadJson)); }
    catch (e) { errorPanel('数据桥返回异常：' + e, post); return; }
    if (!res || !res.ok) { errorPanel(res && res.error, post); return; }
    if (!res.sources || !res.sources.length) {
      errorPanel('未在帖子里解析到播放源。', post);
      return;
    }
    try { render(res, post); }
    catch (e2) {
      errorPanel('播放源显示失败：' + (e2 && e2.message ? e2.message : e2), post);
    }
  };

  function render(data, post) {
    var entry = postEntry();
    lastSources = data.sources || [];
    var title = entry.t || data.title || '在线播放';
    titleEl.textContent = title;
    heroEl.className = 'pl-hero' + (entry.c ? '' : ' no-cover');
    heroEl.innerHTML =
      (entry.c
        ? '<img class="pl-hero-img" data-hero-img src="' + esc(entry.c) + '" alt="" '
          + 'referrerpolicy="no-referrer" decoding="async">'
          + '<div class="pl-hero-scrim" aria-hidden="true"></div>'
        : '')
      + '<div class="pl-hero-body">'
      + '<span class="pl-hero-src">' + esc(originLabel(entry.u)) + '</span>'
      + '<span class="pl-hero-title">' + esc(title) + '</span>'
      + (entry.d
          ? '<span class="pl-hero-meta">' + ICON_CAL + esc(entry.d) + '</span>'
          : '')
      + '</div>';
    heroEl.hidden = false;
    // The playable subset, in resolve order, becomes the player's queue;
    // each in-app button carries only its index into it.
    playQueue = [];
    var queueIdx = {};
    data.sources.forEach(function (s, i) {
      if (s.kind === 'hls' || s.kind === 'direct') {
        queueIdx[i] = playQueue.length;
        playQueue.push({ u: s.url, l: s.label || ('源' + (i + 1)), k: s.kind });
      }
    });
    // A multi-track work (asmr.one) gets the strip: one tap plays the whole
    // queue from the head, and every row's "+" starts it at its own track
    // (Eara's addedToQueue: a state on the row, no navigation).
    var queueStrip = playQueue.length > 1
      ? '<button type="button" class="play-queuebar" data-action="play-queue">'
        + ICON_LIST + '从第 1 轨连续播放'
        + '<span class="pl-qc">' + playQueue.length + ' 轨</span>'
        + '</button>'
      : '';
    // A track's folder is worth a row's width only when the name alone does
    // not identify it: 「01_あさ」 twice in one work needs "wav"/"wav2" beside
    // it, but the usual work repeats the same folder names on every row, and
    // that boilerplate is what used to push the name itself off the line.
    var nameCount = {};
    data.sources.forEach(function (s) {
      var n = String(s.label || '').trim();
      if (n) nameCount[n] = (nameCount[n] || 0) + 1;
    });
    var buttons = data.sources.map(function (s, i) {
      var host = String(s.url).replace(/^https?:\/\//, '').split('/')[0];
      var name = String(s.label || ('源' + (i + 1))).trim();
      // The immediate folder, not the whole path: the deepest segment is the
      // one that differs between two same-named tracks.
      var parts = String(s.group || '').split(' · ');
      var tail = nameCount[name] > 1 ? (parts[parts.length - 1] || '') : '';
      // One row style for every source now. kind === 'hls' | 'direct' means
      // the URL already addresses media bytes; 'embed' is a third-party
      // player *page*, resolved on tap — the bridge loads it in a shielded
      // hidden WebView and hands back the media the running player fetches
      // (resolveEmbed). Both paths end in the same in-app player, so both
      // rows read and behave identically up front; only a failed resolve
      // rewinds a row into the plain link it used to be.
      var media = s.kind === 'hls' || s.kind === 'direct';
      var rowOpen = '<div class="play-enter is-inapp' + (i === 0 ? ' is-primary' : '')
        + '" data-inapp="1"'
        + (media
          ? ' data-url="' + esc(s.url) + '" data-kind="' + esc(s.kind) + '"'
            + ' data-qi="' + queueIdx[i] + '"'
          : ' data-embed="1" data-src-index="' + i + '"'
            + ' data-url="' + esc(s.url) + '"')
        + ' data-referer="' + esc(s.referer || post) + '">';
      var pill = '<button type="button" class="play-inapp" data-action="'
        + (media ? 'play-inapp' : 'embed-play') + '"'
        + ' data-url="' + esc(s.url) + '"'
        + (media ? ' data-kind="' + esc(s.kind) + '"' : '')
        + ' data-referer="' + esc(s.referer || post) + '"'
        + (media ? ' data-qi="' + queueIdx[i] + '"' : '')
        + ' aria-label="在应用内播放">应用内播放</button>';
      // Per-track queue entry: the "+" starts the queue at this track. The
      // referer and index ride the button so the handler needs no closure.
      // An embed row joins only after its resolve — unresolvable URLs do
      // not belong in a queue that walks itself.
      var addQ = media && playQueue.length > 1
        ? '<button type="button" class="play-addq" data-action="queue-add"'
          + ' data-referer="' + esc(s.referer || post) + '"'
          + ' data-qi="' + queueIdx[i] + '"'
          + ' aria-label="从这一轨开始连播" aria-pressed="false">+</button>'
        : '';
      // A media row is a BUTTON, not a link. Its href would be the audio bytes
      // themselves, and a WebView that lands on those throws the page away for
      // Chromium's bare player — title gone, list gone, no way back, which is
      // what a tap on an asmr.one track used to do (and why the new source
      // read as "does not respond"). The row carries the pill's own action,
      // so the whole card is the target a thumb reaches for. Embed rows used
      // to be links by necessity (only a page could play them); they keep no
      // href either — a link would skip the resolve and land the old
      // third-party page right back on top of the unified one.
      return '<div class="play-row' + (i === 0 ? ' is-primary' : '') + '"'
        + ' style="--i:' + i + '">'
        + rowOpen
        + '<span class="src-ico" aria-hidden="true">' + ICON_PLAY + '</span>'
        + '<span class="src-body"><strong><span class="src-name">' + esc(name)
        + '</span>'
        + (i === 0 ? '<span class="src-badge">推荐</span>' : '')
        + '</strong><span class="src-host">' + ICON_GLOBE
        + '<span class="src-meta">' + esc(host)
        + (tail ? ' · ' + esc(tail) : '')
        + ' · 应用内'
        + '</span></span></span>'
        + pill
        + addQ
        + '</div>';
    }).join('');
    dockEl.innerHTML =
      '<div class="pl-sec"><span class="pl-sec-title">播放源</span>'
      + '<span class="pl-sec-count">' + data.sources.length + ' 个</span></div>'
      + queueStrip
      + buttons
      + '<div class="play-foot">'
      + '<div class="play-links">'
      + '<a class="glass-chip play-ext" href="' + esc(post) + '">'
      + ICON_EXT + '原帖页</a>'
      + '<a class="glass-chip play-ext" href="discover.html">'
      + ICON_GRID + '发现页</a>'
      + '</div>'
      + '<p class="play-hint muted">' + ICON_SHIELD
      + '<span>广告与越权跳转由应用内广告盾拦截；返回键回到本页可切换其它源。</span>'
      + '</p>'
      + '</div>';
    dockEl.hidden = false;
    skelEl.hidden = true;
    statusEl.hidden = true;
  }

  function load(attempt) {
    var b = window.__asmrlibDiscover;
    attempt = attempt || 0;
    var post = postEntry().u;
    if (!b) {
      if (attempt < 8) {
        setTimeout(function () { load(attempt + 1); }, 400);
        return;
      }
      errorPanel('数据桥不可用——请用 APK 打开本页', post);
      return;
    }
    if (!post) {
      errorPanel('缺少帖子地址。', '');
      return;
    }
    dockEl.hidden = true;
    errEl.hidden = true;
    skelEl.hidden = false;
    statusEl.textContent = '';
    statusEl.hidden = true;
    seq += 1;
    var id = 'p' + seq + '-' + Math.floor(Math.random() * 1e6);
    var entry = { post: post, busy: 0 };
    pending[id] = entry;
    // The bridge memoizes results, so a cache hit answers in milliseconds —
    // the skeleton is already painted and simply disappears on a fast hit.
    // The bridge times out at 20s; this watchdog only covers a lost delivery.
    setTimeout(function () {
      if (pending[id]) {
        if (entry.busy) clearTimeout(entry.busy);
        delete pending[id];
        errorPanel('连接超时——播放器解析长时间没有响应。', post);
      }
    }, 25000);
    try { b.resolvePost(post, id); }
    catch (e) {
      if (entry.busy) clearTimeout(entry.busy);
      delete pending[id];
      errorPanel('数据桥调用失败：' + e, post);
      return;
    }
  }

  load();
})();
</script>
</body>
</html>
