name: android-apk

# 本机没有 JDK / Android Studio 也能拿到 APK：推送到 GitHub 后在 Actions
# 里自动构建，Artifacts 下载 app-debug.apk 直接 adb install。
on:
  push:
    branches: [main]
    paths: ["android/**", "src/asmrlib_archiver/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Sync blocklist asset from Python tables
        run: |
          python -m pip install --disable-pip-version-check -q pyyaml
          python -m asmrlib_archiver.mobile_blocklist
          git diff --exit-code -- android/app/src/main/assets/blocklist.json \
            || echo "::warning::blocklist.json out of date — run python -m asmrlib_archiver.mobile_blocklist and commit"

      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asmrlib-archiver-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
